<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/css/main.css" />
    <title>Contact Us</title>
  </head>
  <body>
    <!--Start-->
    <div class="main-wrapper">
      <header class="site-header" id="siteHeader">
        <div class="header-container">
          <!-- logo -->
          <a href="./index.html" class="brand-logo" aria-label="صفحه اصلی شرکت">
            <span class="logo-text">هلدینگ آتین سازگان فرداد </span>
          </a>

          <!-- mobile hamburger -->
          <button
            class="nav-toggle"
            id="navToggle"
            aria-expanded="false"
            aria-controls="primaryNav"
            aria-label="باز و بستن منو"
          >
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
          </button>

          <!-- navigation links -->
          <nav class="primary-nav" id="primaryNav">
            <ul class="nav-list">
              <li class="nav-item">
                <a href="./index.html" class="nav-link active">خانه</a>
              </li>
              <li class="nav-item">
                <a href="./services.html" class="nav-link">خدمات</a>
              </li>
              <li class="nav-item">
                <a href="./projects.html" class="nav-link">پروژه‌ها</a>
              </li>
              <li class="nav-item">
                <a href="./about.html" class="nav-link">درباره ما</a>
              </li>
              <li class="nav-item">
                <a href="./contacts.html" class="nav-link">تماس با ما</a>
              </li>
            </ul>
          </nav>

          <!--languages-->
          <nav class="language-switcher" aria-label="انتخاب زبان">
            <ul class="lang-list">
              <li>
                <a
                  href="/en"
                  class="lang-link"
                  lang="en"
                  hreflang="en"
                  title="English"
                >
                  <img
                    src="./src/images/header/svg/flag-for-flag-united-kingdom-svgrepo-com.svg"
                    alt="English"
                    class="flag-icon"
                  />
                </a>
              </li>
            
              <li>
                <a
                  href="/ar"
                  class="lang-link"
                  lang="ar"
                  hreflang="ar"
                  title="العربية"
                >
                  <img
                    src="./src/images/header/svg/flag-for-flag-united-arab-emirates-svgrepo-com.svg"
                    alt="العربية"
                    class="flag-icon"
                  />
                </a>
              </li>

              <li>
                <a
                  href="/fa"
                  class="lang-link active"
                  lang="fa"
                  hreflang="fa"
                  title="فارسی"
                >
                  <img
                    src="./src/images/header/svg/flag-for-flag-iran-svgrepo-com.svg"
                    alt="فارسی"
                    class="flag-icon"
                  />
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </header>
      <div class="hero-wrapper"></div>
    </div>
    <!--end of the project-->
  </body>
</html>
